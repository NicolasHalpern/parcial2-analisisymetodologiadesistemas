{# Esqueleto de las pantallas de ingreso y registro, con el estilo de la tienda. #}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#c8102e">
  <title>{% block titulo %}{% endblock %} · {{ comercio_nombre }}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root { --rojo:#c8102e; --rojo-osc:#9e0c24; --crema:#fbf6ef; --tinta:#2b2118; --suave:#7a6a5c; --borde:#eadfd2; }
    body { background: var(--crema); color: var(--tinta); font-family: Inter, system-ui, sans-serif; min-height: 100vh; }
    h1, .display-font { font-family: Fraunces, Georgia, serif; }
    .franja { background: var(--rojo); color: #fff; padding: 1.4rem 0 4.5rem; }
    .franja a { color: #fff; text-decoration: none; }
    .tarjeta { background: #fff; border: 1px solid var(--borde); border-radius: 1.2rem; max-width: 440px; margin: -3.2rem auto 2rem; padding: 2rem; box-shadow: 0 10px 30px rgba(43,33,24,.08); }
    .btn-rojo { background: var(--rojo); border-color: var(--rojo); color: #fff; }
    .btn-rojo:hover, .btn-rojo:focus { background: var(--rojo-osc); border-color: var(--rojo-osc); color: #fff; }
    .form-control { border-radius: .7rem; padding: .65rem .9rem; border-color: var(--borde); }
    .form-control:focus { border-color: var(--rojo); box-shadow: 0 0 0 .2rem rgba(200,16,46,.12); }
    .form-label { font-size: .85rem; font-weight: 600; margin-bottom: .3rem; }
    .enlace { color: var(--rojo); font-weight: 600; text-decoration: none; }
  </style>
</head>
<body>
  <div class="franja"><div class="container" style="max-width:440px">
    <a href="{% url 'tienda' %}" class="small opacity-75"><i class="bi bi-arrow-left"></i> Volver al menú</a>
    <h1 class="display-font fw-bold mt-2 mb-0" style="font-size:2rem">{{ comercio_nombre }}</h1>
  </div></div>
  <main class="px-3"><div class="tarjeta">{% block contenido %}{% endblock %}</div></main>
  <script>
    // Ver / ocultar contraseña
    document.querySelectorAll('[data-ver]').forEach(b => b.onclick = () => {
      const i = document.getElementById(b.dataset.ver); i.type = i.type === 'password' ? 'text' : 'password';
      b.innerHTML = i.type === 'password' ? '<i class="bi bi-eye"></i>' : '<i class="bi bi-eye-slash"></i>';
    });
  </script>
</body>
</html>
